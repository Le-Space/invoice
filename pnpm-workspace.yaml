nodeLinker: isolated
packages:
  - '.'
  - app
# As in Le-Space/belege: OrbitDB's sync needs gossipsub on libp2p v3.
overrides:
  '@libp2p/gossipsub': 16.1.0
onlyBuiltDependencies:
  - esbuild
  # libp2p's WebRTC in Node (the app's unit specs); the browser build does not use it.
  - node-datachannel
