name: CI

# core: the pure invoice modules, their specs and formatting; the PDF is drawn
# and read back in memory. xrechnung: made-up invoices as XRechnung, checked by
# the KoSIT validator with its XRechnung configuration (scripts/kosit.sh); a
# fixture it does not accept fails the build. app: the PWA under app/ — lint,
# types, unit specs (a real OrbitDB and Helia in Node), the build, and the
# browser specs with a virtual passkey.

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.head_ref || github.sha }}
  cancel-in-progress: true

jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22.x'
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Test
        run: pnpm test

  xrechnung:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22.x'
          cache: pnpm
      # The validator is Java (11 or later).
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - name: Install
        run: pnpm install --frozen-lockfile
      # Pinned by version and SHA-256 in scripts/kosit.sh, so the key changes with them.
      - uses: actions/cache@v6
        with:
          path: .kosit
          key: kosit-${{ hashFiles('scripts/kosit.sh') }}
      - name: XRechnung, checked by KoSIT
        run: pnpm xrechnung:validate
      - name: Keep the reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: kosit-reports
          path: .kosit/run/
          retention-days: 7

  app:
    runs-on: ubuntu-latest
    # Same Playwright version as app/package.json, so the browsers are there.
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      # The Playwright image runs as root; git refuses a checkout owned by
      # someone else without it.
      - name: Let git read the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22.x'
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm app:lint
      - name: Types
        run: pnpm app:check
      - name: Unit tests
        run: pnpm app:test
      - name: Build
        run: pnpm app:build
      - name: Browser specs
        run: pnpm app:e2e
      - name: Keep the evidence
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: app/test-results/
          retention-days: 7
